services:
  histoseg-core:
    build:
      context: .
      target: core
    image: histoseg:core
    working_dir: /workspace
    volumes:
      - .:/workspace
    entrypoint: ["histoseg-3d"]
    command: ["--help"]

  histoseg-viz:
    build:
      context: .
      target: viz
    image: histoseg:viz
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PYVISTA_OFF_SCREEN: "true"
    entrypoint: ["histoseg-3d"]
    command: ["--help"]

  histoseg-serve:
    build:
      context: .
      target: serve
    image: histoseg:serve
    ports:
      - "7860:7860"
    environment:
      PORT: "7860"
      APP_DATA_DIR: "/home/username/app/project-vol"
    volumes:
      - histoseg-serve-data:/home/username/app/project-vol

volumes:
  histoseg-serve-data:
