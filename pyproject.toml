[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "histoseg"
dynamic = ["version"]
description = "Python toolkit for H&E image analysis and spatial contour analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Taobo Hu", email = "taobo.hu@scilifelab.se" }]
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "seaborn",
    "shapely",
    "matplotlib",
    "openai>=1.0.0",
]

[project.optional-dependencies]
he = [
    "torch",
    "transformers",
    "accelerate",
    "pillow",
    "opencv-python-headless",
    "rasterio",
]

[project.urls]
Homepage = "https://github.com/hutaobo/HistoSeg"
Documentation = "https://histoseg.readthedocs.io"

# Derive the package version from Git tags and write it into the version module.
[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
write_to = "src/histoseg/_version.py"

# Reserved for future automated semantic-release publishing.
[tool.semantic_release]
branch = "master"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/histoseg/_version.py:__version__"]
