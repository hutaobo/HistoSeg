{% set name = "histoseg" %}
{% set version = environ.get("RECIPE_VERSION", "") %}
{% set python_min = "3.10" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: "{{ environ.get('RECIPE_SDIST_URL', '') }}"
  sha256: "{{ environ.get('RECIPE_SHA256', '') }}"

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - histoseg-gui = histoseg.gui.gui_app:main
    - histoseg-ai-pathologist = histoseg.spatial_pathologist.cli:main
    - histoseg-ai-pathologist-full-auto = histoseg.spatial_pathologist.full_auto_cli:main
    - histoseg-ai-driven-spatial-pathologist-serve = histoseg.spatial_pathologist.serve_app:main
    - histoseg-ai-driven-spatial-pathologist-run = histoseg.spatial_pathologist.serve_cli:main
    - histoseg-he = histoseg.he.cli:main
    - histoseg-contour = histoseg.contour.cli:main
    - histoseg-3d = histoseg.threed.cli:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=68
    - setuptools-scm >=8
    - wheel
  run:
    - python >={{ python_min }}
    - numpy
    - pandas
    - pyarrow
    - scipy
    - scikit-image
    - scikit-learn
    - seaborn
    - shapely
    - matplotlib-base
    - networkx
    - openai >=1.0.0
    - huggingface_hub
    - cell-gps >=0.0.4

test:
  imports:
    - histoseg
    - histoseg.contour
    - histoseg.io
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/hutaobo/HistoSeg
  doc_url: https://histoseg.readthedocs.io
  summary: 3D Xenium contour reconstruction toolkit with H&E image analysis and 2D spatial contour workflows.
  license: PolyForm-Noncommercial-1.0.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hutaobo
