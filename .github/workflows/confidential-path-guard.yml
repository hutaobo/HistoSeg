name: Confidential Path Guard

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  block-confidential-paths:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fail on confidential patent paths
        run: python scripts/check_no_patent_files.py --tracked
